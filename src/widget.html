<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chores Widget</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      background: var(--hub-surface, #fff);
      color: var(--hub-text, #111827);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 8px;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .header-week  { font-size: 11px; color: var(--hub-text-muted, #6b7280); }
    .header-pts   { font-size: 11px; font-weight: 600; color: #059669; }

    .chore-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .chore-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      cursor: pointer;
      transition: background .1s;
      border-bottom: 1px solid #f3f4f6;
    }
    .chore-row:last-child { border-bottom: none; }
    .chore-row:hover { background: var(--hub-bg, #f9fafb); }

    .check {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
      font-size: 10px;
      color: transparent;
    }
    .chore-row.done .check {
      background: #059669;
      border-color: #059669;
      color: white;
    }

    .chore-name {
      flex: 1;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chore-row.done .chore-name {
      color: #9ca3af;
      text-decoration: line-through;
    }
    .daily-tag {
      font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      color: var(--hub-text-muted, #6b7280); background: var(--hub-bg, #f3f4f6); padding: 1px 5px; border-radius: 8px;
      vertical-align: middle; text-decoration: none;
    }

    .chore-pts {
      font-size: 11px;
      font-weight: 600;
      color: var(--hub-text-muted, #6b7280);
      flex-shrink: 0;
    }
    .chore-row.done .chore-pts { color: #d1d5db; }

    .footer {
      padding: 7px 14px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--hub-bg, #f9fafb);
    }
    .footer-earned { font-size: 11px; color: var(--hub-text-muted, #6b7280); }
    .footer-earned strong { color: #059669; }
    .open-link {
      font-size: 11px;
      font-weight: 600;
      color: var(--hub-text, #111827);
      text-decoration: none;
    }
    .open-link:hover { text-decoration: underline; }

    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 12px;
      gap: 4px;
      padding: 12px;
    }
    .loading { color: #9ca3af; padding: 20px 14px; font-size: 12px; }
  </style>
</head>
<body>
<script type="module">
import { memberColor, initial, esc, isAdult, hubToday, createDbHelper } from "/hub-sdk.js";
import { isAssigned, isoWeek, weekLabel, fmtDollars, streakEvent, isDuplicateRowError, publishAppEvent } from "./logic.js";

const CONTEXT    = window.__CONTEXT_URL ?? "";
const DB         = window.__DB_URL      ?? "";
const EVENTS     = window.__EVENTS_URL  ?? "";
const APP_ID     = window.__APP_ID      ?? "chore-tracker";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;

let members     = [];
let chores      = [];
let doneDays    = new Map();   // choreId -> Set<day>; day "" = weekly, "YYYY-MM-DD" = daily
let settings    = { centsPerPoint: 10 };
// The HOUSEHOLD's calendar day, as the app uses (see index.html): completions
// are keyed by (week, day), so a widget on a device in another timezone, or
// ticked just before midnight, must not write a different day or week. Read
// at use, never frozen at load: a widget stays mounted across midnight.
const hubDay    = () => new Date(`${hubToday()}T12:00:00`);
const weekNow   = () => isoWeek(hubDay());
let loadedWeek  = weekNow();   // the week doneDays describes
let notice      = "";
let noticeTimer = null;

function showNotice(text) {
  notice = text;
  // One timer at a time, so an earlier failure cannot clear a later notice.
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { notice = ""; render(); }, 4000);
  render();
}

// "Done right now" — today for daily chores, this week for weekly chores.
const dayFor    = c => c.frequency === "daily" ? hubToday() : "";
const isDoneNow = c => doneDays.get(c.id)?.has(dayFor(c)) ?? false;

async function dbq(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  return res.json();
}

// A statement whose failure must stop the caller (it throws the hub's error
// text): a tick is only real, and only earns points, when its row is saved.
const dbChecked = createDbHelper(DB);

async function loadMembers() {
  if (!CONTEXT) {
    members = [{ id: "demo", name: "You", role: "child" }];
    return;
  }
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    members = ((await res.json())["family.members"]) ?? [];
  } catch { members = []; }
}

async function load() {
  const memberId = HUB_MEMBER?.id;
  if (!memberId) { render(); return; }
  const week = weekNow();

  const [{ rows: choreRows }, { rows: settRows }, { rows: doneRows }] = await Promise.all([
    dbq(`SELECT id, name, points, assigned_to, frequency FROM app_chore_tracker__chores ORDER BY created_at`),
    dbq(`SELECT key, value FROM app_chore_tracker__settings`),
    dbq(`SELECT chore_id, day FROM app_chore_tracker__completions WHERE member_id = ? AND week = ?`, [memberId, week]),
  ]);

  // points as a number, always: it is rendered unescaped (see index.html).
  chores = choreRows.map(r => ({ ...r, points: Number(r.points) || 0, assignedTo: JSON.parse(r.assigned_to ?? "[]"), frequency: r.frequency ?? "weekly" }));
  for (const { key, value } of settRows) {
    if (key === "centsPerPoint") settings.centsPerPoint = Number(value);
  }
  doneDays = new Map();
  loadedWeek = week;
  for (const r of doneRows) {
    if (!doneDays.has(r.chore_id)) doneDays.set(r.chore_id, new Set());
    doneDays.get(r.chore_id).add(r.day ?? "");  // weekly chores carry day ""
  }

  render();
}

async function toggle(choreId) {
  const memberId = HUB_MEMBER?.id;
  if (!memberId) return;
  // A new week since load: what doneDays says is last week's. Reload first.
  const week = weekNow();
  if (week !== loadedWeek) {
    try { await load(); } catch { showNotice("Couldn't refresh chores. Try again."); return; }
  }
  const chore = chores.find(c => c.id === choreId);
  const day   = chore?.frequency === "daily" ? hubToday() : "";
  const days  = doneDays.get(choreId) ?? new Set();
  // Only the write decides success. The streak after a saved row is a
  // best-effort side effect and must never report the save as failed.
  let inserted = false;
  try {
    if (days.has(day)) {
      await dbChecked(`DELETE FROM app_chore_tracker__completions WHERE chore_id=? AND member_id=? AND week=? AND day=?`,
        [choreId, memberId, week, day]);
      days.delete(day);
    } else {
      // A plain single-row INSERT, never OR IGNORE: the hub publishes
      // chore.completed from this row and refuses a conflict-resolving insert
      // here. A primary-key error means the row is already there (ticked in the
      // app or on another device), which is "checked", not a failure.
      try {
        await dbChecked(
          `INSERT INTO app_chore_tracker__completions (chore_id, member_id, week, day, completed_at) VALUES (?,?,?,?,?)`,
          [choreId, memberId, week, day, new Date().toISOString()]);
        inserted = true;
      } catch (error) {
        if (!isDuplicateRowError(error?.message)) throw error;
      }
      days.add(day);
    }
  } catch {
    // Leave the tick as it was: the row was not saved.
    showNotice("Couldn't save that. Try again.");
    return;
  }
  doneDays.set(choreId, days);
  if (notice) { clearTimeout(noticeTimer); notice = ""; }
  render();
  if (inserted && chore?.frequency === "daily") {
    announceStreak(chore, choreId, memberId, week, days.size).catch(() => {});
  }
}

// Counted from the stored rows, not the snapshot: days ticked in the app or on
// another device since load decide which streak this is. A failed read falls
// back to the snapshot.
async function announceStreak(chore, choreId, memberId, week, snapshot) {
  let stored = 0;
  try {
    const { rows } = await dbChecked(
      `SELECT day FROM app_chore_tracker__completions WHERE chore_id = ? AND member_id = ? AND week = ?`,
      [choreId, memberId, week]);
    stored = rows?.length ?? 0;
  } catch { /* snapshot below */ }
  const count = Math.max(stored, snapshot);
  const member = members.find(m => m.id === memberId) ?? HUB_MEMBER;
  const streak = streakEvent({ chore, choreId, member, memberId, week, count });
  if (streak) await publishAppEvent(EVENTS, { type: streak.type, subjectId: memberId, payload: streak.payload, key: streak.key });
}

function render() {
  const memberId = HUB_MEMBER?.id;

  if (!memberId) {
    document.body.innerHTML = `
      <div class="header"></div>
      <div class="empty">
        <span>Sign in to see your chores</span>
        <a href="/run/${APP_ID}" style="color:#111827;font-weight:600;font-size:11px">Open app →</a>
      </div>`;
    return;
  }

  const myChores = chores.filter(c => isAssigned(c, memberId, members));

  const doneNowCount = myChores.filter(isDoneNow).length;
  const header = `
    <div class="header">
      <span class="header-week">${weekLabel(hubDay())}</span>
      <span class="header-pts">${doneNowCount}/${myChores.length} done</span>
    </div>`;

  let rows;
  if (myChores.length === 0 && !DB) {
    rows = `<div class="empty"><span>No chores yet</span><a href="/run/${APP_ID}" style="color:#111827;font-weight:600;font-size:11px">Set up chores →</a></div>`;
  } else if (myChores.length === 0) {
    rows = `<div class="empty"><span>No chores assigned to you</span></div>`;
  } else {
    // Show undone first, then done
    const sorted = [...myChores].sort((a, b) => {
      const ad = isDoneNow(a), bd = isDoneNow(b);
      return ad === bd ? 0 : ad ? 1 : -1;
    });
    rows = `<div class="chore-list">
      ${sorted.map(c => {
        const done    = isDoneNow(c);
        const isDaily = c.frequency === "daily";
        return `<div class="chore-row ${done ? "done" : ""}" data-chore-toggle="${esc(c.id)}">
          <div class="check">${done ? "✓" : ""}</div>
          <span class="chore-name">${esc(c.name)}${isDaily ? ' <span class="daily-tag">daily</span>' : ""}</span>
          <span class="chore-pts">${c.points}pt${c.points !== 1 ? "s" : ""}</span>
        </div>`;
      }).join("")}
    </div>`;
  }

  // Per-day scoring: a daily chore earns its points once per day completed this week.
  const earnedPts = myChores.reduce((sum, c) =>
    sum + c.points * (doneDays.get(c.id)?.size ?? 0), 0);
  const earned = fmtDollars(earnedPts * settings.centsPerPoint);

  const footer = `
    <div class="footer">
      <span class="footer-earned">${notice ? `<span role="alert">${esc(notice)}</span>` : `Earned this week: <strong>${earned}</strong>`}</span>
      <a class="open-link" href="/run/${APP_ID}">All chores →</a>
    </div>`;

  document.body.innerHTML = header + rows + footer;
}

// Delegated, never an inline onclick: a chore id is data any space participant
// can write, and interpolating it into a handler string would run it as code.
document.body.addEventListener("click", (e) => {
  const t = e.target.closest("[data-chore-toggle]");
  if (t) toggle(t.getAttribute("data-chore-toggle")).catch(() => {});
});

(async () => {
  await loadMembers();
  await load();

  // Refresh the widget when allowance is earned. Must be a type this app
  // declares in its manifest (publishes/subscribes_to) — the hub 403s reads of
  // undeclared event types.
  if (EVENTS) {
    const { createEventPoller } = await import("/hub-sdk.js");
    createEventPoller(EVENTS, "allowance.earned", () => load(), 60_000);
  }
})();
</script>
</body>
</html>
